appId: com.lisn.player
productName: LISN
copyright: 仅供个人学习试听
directories:
  output: release
files:
  - out/**
  - package.json
  - build/icon.png
  - build/icon.ico
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
    - target: zip
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 聆 LISN
  artifactName: 聆LISN-安装包-${version}.${ext}
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
